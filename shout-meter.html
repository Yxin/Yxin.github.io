<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shout Rocket!</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;background:#1b1446;color:#fff}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center;background:linear-gradient(#2b1055,#7597de)}
.screen.on{display:flex}
h1{font-size:clamp(40px,11vw,76px);margin:0;color:#ffe14d;text-shadow:4px 4px 0 #ff3d7f;line-height:1.05}
h2{font-size:clamp(30px,8vw,50px);margin:0}
p{font-size:clamp(17px,4.5vw,22px);margin:0}
button{font-family:inherit;font-size:clamp(22px,6vw,32px);padding:16px 30px;border:none;border-radius:999px;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.3);min-width:250px}
button:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.pink{background:#ff3d7f}.green{background:#22b573}.yellow{background:#ffb800;color:#432}.grey{background:#8a8fb8}
.names{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.names input{font-family:inherit;font-size:22px;width:150px;padding:10px;border-radius:14px;border:5px solid #fff;text-align:center}
#n1{border-color:#ff3d7f}#n2{border-color:#22b573}
.diff{display:flex;gap:10px}.diff button{min-width:0;font-size:38px;padding:10px 18px;background:rgba(255,255,255,.2);box-shadow:none;border:4px solid transparent}
.diff button.sel{border-color:#ffe14d;background:rgba(255,225,77,.3)}
.small{font-size:15px;opacity:.85;max-width:440px}
.bigEmoji{font-size:clamp(90px,28vw,160px);line-height:1}
.playerTag{display:inline-block;padding:8px 22px;border-radius:999px;font-size:clamp(26px,7vw,40px);font-weight:bold}
/* ---- sky ---- */
#play{padding:0;justify-content:flex-start;background:linear-gradient(to top,#8fd8ff 0%,#5aa9f0 35%,#2c4fb8 65%,#120c3a 88%,#05031a 100%)}
#sky{position:absolute;left:0;right:0;top:70px;bottom:60px}
.mark{position:absolute;right:6%;font-size:clamp(30px,9vw,46px);transform:translateY(50%)}
.mark.hit{animation:bounce .5s}
@keyframes bounce{50%{transform:translateY(50%) scale(1.6)}}
#ground{position:absolute;left:0;right:0;bottom:0;height:60px;background:#3cbf5a;border-top:6px solid #2a9a44}
#rocketBox{position:absolute;left:30%;width:80px;margin-left:-40px;bottom:0;transform:translateY(50%)}
#rocket{font-size:64px;display:block;transform:rotate(-45deg);line-height:1}
#flame{position:absolute;left:50%;top:62px;font-size:40px;transform:translateX(-50%) rotate(180deg) scale(0);transform-origin:top center;line-height:1}
.flag{position:absolute;left:12%;width:42%;height:0;border-top:5px dashed;transform:translateY(50%);display:none}
.flag span{position:absolute;left:-36px;top:-24px;font-size:30px}
#best{border-color:#ffe14d}#rival{border-color:#22b573}
#topbar{position:absolute;top:0;left:0;right:0;height:70px;display:flex;align-items:center;justify-content:center;gap:12px;z-index:3}
#light{font-size:44px;letter-spacing:4px}
#fuse{position:absolute;left:10%;right:10%;bottom:18px;height:22px;border-radius:11px;background:rgba(0,0,0,.25);overflow:hidden;z-index:3}
#fuseIn{height:100%;width:100%;background:linear-gradient(90deg,#ff2d55,#ffb800);border-radius:11px}
#face{position:absolute;left:30%;bottom:8px;margin-left:-110px;font-size:48px;z-index:3}
#bigMsg{position:absolute;top:38%;left:0;right:0;text-align:center;font-size:clamp(50px,15vw,96px);font-weight:bold;text-shadow:4px 4px 0 rgba(0,0,0,.35);z-index:4;pointer-events:none}
.shake{animation:shake .12s infinite}
@keyframes shake{25%{transform:translate(2px,-2px)}75%{transform:translate(-2px,2px)}}
/* mini result sky */
.mini{position:relative;width:min(86vw,360px);height:min(46vh,340px);border-radius:24px;overflow:hidden;background:linear-gradient(to top,#8fd8ff,#2c4fb8 60%,#05031a);border:5px solid #fff}
.mini .mk{position:absolute;right:8px;font-size:24px;transform:translateY(50%)}
.mini .r{position:absolute;font-size:44px;transform:translate(-50%,50%) rotate(-45deg)}
.mini .crown{position:absolute;font-size:36px;transform:translate(-50%,-10%)}
.stars{font-size:clamp(30px,9vw,44px);min-height:1.2em}
#scoreRows{display:flex;flex-direction:column;gap:8px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
</style></head><body>
<canvas id="confetti"></canvas>

<div class="screen on" id="menu">
  <h1>🚀 SHOUT<br>ROCKET! 🚀</h1>
  <p>Shout LOUD to fly your rocket to the moon! 🌙</p>
  <button class="pink" onclick="startSolo()">🙋 Just Me</button>
  <button class="green" onclick="show('setup')">🥊 Compete!</button>
  <div class="diff" id="diff"><button onclick="setDiff(0)">🐣</button><button onclick="setDiff(1)" class="sel">🐯</button><button onclick="setDiff(2)">🦖</button></div>
  <p class="small">🐣 easy · 🐯 normal · 🦖 super hard<br>Mic sound stays on this phone. Nothing is recorded or sent anywhere.</p>
</div>

<div class="screen" id="setup">
  <h2>Who's playing?</h2>
  <div class="names"><input id="n1" value="Yu Xin" maxlength="10"><input id="n2" value="Nephew" maxlength="10"></div>
  <p>🩷 pink rocket vs 💚 green rocket<br>3 rounds. Highest rocket wins a ⭐</p>
  <button class="green" onclick="startCompete()">▶️ Start!</button>
  <button class="grey" onclick="show('menu')">⬅️ Back</button>
</div>

<div class="screen" id="ready">
  <div class="stars" id="readyStars"></div>
  <div class="bigEmoji" id="readyRocket">🚀</div>
  <div class="playerTag" id="readyWho"></div>
  <button class="yellow" onclick="beginTurn()">🎤 GO!</button>
</div>

<div class="screen" id="play">
  <div id="topbar"><span id="light"></span></div>
  <div id="sky">
    <div class="flag" id="rival"><span>🚩</span></div>
    <div class="flag" id="best"><span>⭐</span></div>
    <div id="rocketBox"><span id="rocket">🚀</span><span id="flame">🔥</span></div>
  </div>
  <div id="ground"></div>
  <div id="face">🤫</div>
  <div id="fuse"><div id="fuseIn"></div></div>
  <div id="bigMsg"></div>
</div>

<div class="screen" id="turnEnd">
  <div class="playerTag" id="teWho"></div>
  <div class="bigEmoji" id="teMark"></div>
  <div class="stars" id="teStars"></div>
  <button class="yellow" id="teNext" onclick="next()">➡️</button>
</div>

<div class="screen" id="roundEnd">
  <div class="mini" id="miniSky"></div>
  <div id="scoreRows"></div>
  <button class="yellow" onclick="next2()">➡️</button>
</div>

<div class="screen" id="win">
  <div class="bigEmoji" id="winEmoji">🏆</div>
  <h1 id="winText"></h1>
  <div id="winRows"></div>
  <button class="pink" onclick="again()">🔁 Again!</button>
  <button class="grey" onclick="show('menu')">🏠</button>
</div>

<div class="screen" id="err">
  <h2>🎤 I can't hear you!</h2>
  <p id="errText"></p>
  <button class="yellow" onclick="show('menu')">OK</button>
</div>

<script>
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on')}
// Landmarks by height (0 = ground, 1 = moon)
const MARKS=[[.07,"🏠"],[.16,"🌳"],[.27,"🏢"],[.39,"☁️"],[.51,"🦅"],[.62,"✈️"],[.73,"🎈"],[.84,"🛰️"],[1,"🌙"]];
const SHOUT_SECS=5, ROUNDS=3;
// Difficulty = how many dB above room noise counts as a "full power" shout
const DIFF=[{range:22,start:5},{range:28,start:7},{range:34,start:9}];
let diff=1;function setDiff(d){diff=d;[...$('diff').children].forEach((b,i)=>b.classList.toggle('sel',i===d))}
let ac,analyser,buf,mode,names,turn,roundH,stars,raf,floorDb=-55,soloBest=0;

async function initMic(){
  if(analyser)return true;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){fail("Open the game from its web link in Chrome so it can use the microphone.");return false}
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    ac=new (window.AudioContext||window.webkitAudioContext)();const src=ac.createMediaStreamSource(stream);
    analyser=ac.createAnalyser();analyser.fftSize=1024;src.connect(analyser);buf=new Float32Array(analyser.fftSize);return true;
  }catch(e){fail("Tap <b>Allow</b> when Chrome asks for the microphone. If you said no before: tap the icon left of the web address → Permissions → Microphone → Allow, then reload.");return false}}
function fail(t){$('errText').innerHTML=t;show('err')}
function db(){analyser.getFloatTimeDomainData(buf);let s=0;for(const v of buf)s+=v*v;return 20*Math.log10(Math.sqrt(s/buf.length)+1e-9)}
// 0..1 power, measured relative to the room's own noise, with an expanding curve so the loud end is dramatic
function power(d){const D=DIFF[diff];const x=Math.max(0,Math.min(1.15,(d-(floorDb+D.start))/D.range));return Math.pow(x,2.2)}

function snd(f1,f2,d,type="triangle",vol=.25){try{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f1,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f2,ac.currentTime+d);g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function fanfare(){[523,659,784,1047,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,f,.28),i*160))}

function buildSky(){const sky=$('sky');sky.querySelectorAll('.mark').forEach(m=>m.remove());
  MARKS.forEach(([h,e],i)=>{const m=document.createElement('div');m.className='mark';m.id='mk'+i;m.textContent=e;m.style.bottom=(h*100)+'%';sky.appendChild(m)})}
buildSky();
function markFor(h){let e="🐌";MARKS.forEach(([mh,me])=>{if(h>=mh-0.01)e=me});return e}
function starsFor(h){return h>=.99?5:h>=.73?4:h>=.51?3:h>=.27?2:h>=.07?1:0}
function starStr(n){return "⭐".repeat(n)+"<span style='opacity:.25'>"+"⭐".repeat(5-n)+"</span>"}

async function startSolo(){if(!await initMic())return;mode=1;names=["Me"];turn=0;soloBest=0;readyScreen()}
async function startCompete(){if(!await initMic())return;mode=2;names=[$('n1').value.trim()||"Pink",$('n2').value.trim()||"Green"];turn=0;stars=[0,0];roundH=[];readyScreen()}
const who=()=>mode===1?0:turn%2, col=p=>mode===2&&p===1?"#22b573":"#ff3d7f";
function readyScreen(){const p=who();$('readyWho').textContent=names[p];$('readyWho').style.background=col(p);
  $('readyRocket').style.filter=p===1&&mode===2?"hue-rotate(110deg)":"none";
  $('readyStars').innerHTML=mode===2?"🩷"+"⭐".repeat(stars[0])+" &nbsp; 💚"+"⭐".repeat(stars[1]):"";show('ready')}

function beginTurn(){if(ac.state==="suspended")ac.resume();show('play');const p=who();
  $('rocket').style.filter=p===1&&mode===2?"hue-rotate(110deg)":"none";
  setRocket(0,0);$('fuseIn').style.width="100%";$('bigMsg').textContent="";$('face').textContent="🤫";
  document.querySelectorAll('.mark').forEach(m=>m.classList.remove('hit'));
  // flags: your best (solo) or the other player's height this round (compete)
  const best=$('best'),rival=$('rival');best.style.display="none";rival.style.display="none";
  if(mode===1&&soloBest>0){best.style.display="block";best.style.bottom=(soloBest*100)+"%"}
  if(mode===2&&p===1&&roundH[rnd()]){rival.style.display="block";rival.style.borderColor="#ff3d7f";rival.style.bottom=(roundH[rnd()][0]*100)+"%"}
  // traffic light: measure room noise while waiting
  const samples=[];let step=0;const lights=["🔴⚫⚫","🔴🟡⚫","🔴🟡🟢"];$('light').textContent=lights[0];snd(500,500,.15,"square",.12);
  const t0=performance.now();cancelAnimationFrame(raf);
  const listen=()=>{samples.push(db());const el=performance.now()-t0;const s=Math.min(2,Math.floor(el/800));
    if(s!==step){step=s;$('light').textContent=lights[s];snd(s===2?900:500,s===2?900:500,.18,"square",.14)}
    if(el<1600)raf=requestAnimationFrame(listen);else{samples.sort((a,b)=>a-b);floorDb=Math.max(-70,Math.min(-30,samples[Math.floor(samples.length*.3)]||-55));
      $('bigMsg').textContent="SHOUT!";setTimeout(()=>{if($('bigMsg').textContent==="SHOUT!")$('bigMsg').textContent=""},700);fly()}};
  raf=requestAnimationFrame(listen)}
const rnd=()=>Math.floor(turn/2);

function setRocket(h,pw){$('rocketBox').style.bottom=(Math.min(h,1)*100)+'%';
  $('flame').style.transform=`translateX(-50%) rotate(180deg) scale(${pw<.02?0:.6+pw*2.2})`;
  $('rocketBox').classList.toggle('shake',pw>.45);
  $('face').textContent=pw<.03?"🤫":pw<.15?"🙂":pw<.35?"😮":pw<.6?"😆":pw<.85?"🤪":"🤯"}
function fly(){let h=0,v=0,maxH=0,last=performance.now(),sm=0,hitIdx=-1;const t0=last;
  const loop=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;
    sm=sm*.7+power(db())*.3;
    // Climb speed follows shout power; rocket slowly sinks when quiet. Time adds up, so steady loud shouting beats a quick yelp.
    v=v*.9+(sm*0.33-0.042)*.1; h=Math.max(0,h+v*dt); if(h<=0)v=Math.max(v,0);
    if(h>maxH)maxH=h;setRocket(h,sm);
    MARKS.forEach(([mh],i)=>{if(i>hitIdx&&maxH>=mh){hitIdx=i;$('mk'+i).classList.add('hit');snd(400+i*120,600+i*150,.15,"sine",.12)}});
    const el=(t-t0)/1000;$('fuseIn').style.width=Math.max(0,100-el/SHOUT_SECS*100)+"%";
    if(maxH>=1){h=1;setRocket(1,1);endTurn(1,true);return}
    if(el<SHOUT_SECS)raf=requestAnimationFrame(loop);else endTurn(Math.min(1,maxH),false)};
  raf=requestAnimationFrame(loop)}

function endTurn(h,moon){const p=who();$('rocketBox').classList.remove('shake');
  if(moon){$('bigMsg').textContent="🌙 MOON! 🌙";fanfare();confetti(2500)}else snd(300,900,.3);
  setTimeout(()=>{
    if(mode===1){soloBest=Math.max(soloBest,h)}
    else{if(!roundH[rnd()])roundH[rnd()]=[0,0];roundH[rnd()][p]=h}
    $('teWho').textContent=names[p];$('teWho').style.background=col(p);
    $('teMark').textContent=markFor(h);$('teStars').innerHTML=starStr(starsFor(h));
    show('turnEnd')},moon?1800:600)}
function next(){if(mode===1){readyScreen();return}
  if(who()===1){roundResult();return}turn++;readyScreen()}
function roundResult(){const [a,b]=roundH[rnd()];const sky=$('miniSky');let html="";
  MARKS.forEach(([h,e])=>html+=`<div class="mk" style="bottom:${h*88+4}%">${e}</div>`);
  html+=`<div class="r" style="left:30%;bottom:${a*88+4}%">🚀</div><div class="r" style="left:62%;bottom:${b*88+4}%;filter:hue-rotate(110deg)">🚀</div>`;
  const tie=Math.abs(a-b)<0.015;
  if(tie){stars[0]++;stars[1]++}else stars[a>b?0:1]++;
  if(!tie){const w=a>b?0:1;html+=`<div class="crown" style="left:${w?62:30}%;bottom:${(w?b:a)*88+4}%;transform:translate(-50%,-110%)">👑</div>`}
  sky.innerHTML=html;
  $('scoreRows').innerHTML=[0,1].map(p=>`<div class="stars"><span class="playerTag" style="background:${col(p)};font-size:22px;padding:4px 14px">${names[p]}</span> ${"⭐".repeat(stars[p])}</div>`).join("");
  show('roundEnd');snd(500,1000,.3);if(!tie)confetti(1200)}
function next2(){turn++;if(rnd()>=ROUNDS){winner();return}readyScreen()}
function winner(){let txt,em;if(stars[0]===stars[1]){txt="TIE! 🤝";em="🤝"}else{const w=stars[0]>stars[1]?0:1;txt=names[w]+"!";em="🏆"}
  $('winText').textContent=txt;$('winEmoji').textContent=em;
  $('winRows').innerHTML=[0,1].map(p=>`<div class="stars"><span class="playerTag" style="background:${col(p)};font-size:22px;padding:4px 14px">${names[p]}</span> ${"⭐".repeat(stars[p])}</div>`).join("");
  show('win');fanfare();confetti(4500)}
function again(){mode===2?startCompete():startSolo()}

function confetti(ms){const c=$('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,vy:2+Math.random()*4,vx:-2+Math.random()*4,r:Math.random()*6.28,s:6+Math.random()*8,col:`hsl(${Math.random()*360},90%,60%)`}));
  const end=performance.now()+ms;(function f(t){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
  if(t<end)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})(performance.now())}
</script></body></html>
