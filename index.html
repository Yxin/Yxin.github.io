<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kid Games</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif;
    background: linear-gradient(160deg, #7c5cff, #ff6b9a 48%, #ffd166);
    color: #fff8d6;
  }
  main { text-align: center; padding: 32px 20px; }
  h1 {
    margin: 0 0 28px;
    font-size: clamp(48px, 12vw, 88px);
    text-shadow: 4px 4px 0 #ff3d7f;
  }
  a.play {
    display: inline-block;
    min-width: min(80vw, 420px);
    font-size: clamp(28px, 7vw, 44px);
    font-weight: bold;
    text-decoration: none;
    color: #fff;
    background: #ff3d7f;
    padding: 22px 48px;
    border-radius: 999px;
    box-shadow: 0 8px 0 #c41e58;
  }
  a.play:active {
    transform: translateY(4px);
    box-shadow: 0 4px 0 #c41e58;
  }
</style>
</head>
<body>
<main>
  <h1>Kid Games</h1>
  <a class="play" href="shout-meter/">📣 Shout Meter!</a>
</main>
</body>
</html>
